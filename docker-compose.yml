services:
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: paimana-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./models:/app/models
      - ./paimana_canonical.db:/app/paimana_canonical.db
      - ./primary_dataset:/app/primary_dataset
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paimana-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - PYTHON_SERVICE_URL=http://ml-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    volumes:
      - ./paimana_canonical.db:/app/paimana_canonical.db
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/home"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: paimana-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
