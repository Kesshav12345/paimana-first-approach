services:
  # ─── ML Python Service ────────────────────────────────────────────────────────
  - type: web
    name: paimana-ml-service
    runtime: docker
    dockerfilePath: ml-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # ─── Java Spring Boot Backend ─────────────────────────────────────────────────
  - type: web
    name: paimana-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: PORT
        value: 8080
      - key: PYTHON_SERVICE_URL
        value: https://paimana-ml-service.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://paimana-frontend.onrender.com

  # ─── React Frontend (Nginx + Static) ─────────────────────────────────────────
  - type: web
    name: paimana-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 80
      - key: BACKEND_URL
        value: https://paimana-backend.onrender.com
